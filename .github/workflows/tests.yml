name: tests
on:
  push:
    paths: ["lab/**", "tests/**", "run_*.py"]
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python run_crypto.py --demo 300 > /dev/null
      - run: python run_backtest.py --synthetic > /dev/null
