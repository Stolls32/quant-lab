name: crypto-bots
on:
  schedule:
    # GitHub's scheduler is unreliable at 5-minute intervals, so instead each
    # run stays alive ~5.7 hours and checks the market every 5 minutes itself.
    # This schedule just restarts it; if one is already running, the new run
    # waits in line instead of starting a second bot.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: crypto
  cancel-in-progress: false
jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trade every 5 minutes (saves after each check)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; enables claude_analyst
        run: python run_crypto.py --loop 300 --max-minutes 340 --save
